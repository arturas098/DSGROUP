plugins { id 'com.android.application' }

// Standard BouncyCastle X.509 certificate generation; used only when pairing.
dependencies {
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
}

android {
    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }
    namespace 'lt.arturas.tvpultas'
    compileSdk 35
    defaultConfig {
        applicationId 'lt.arturas.tvpultas'
        minSdk 28
        targetSdk 32
        versionCode 10
        versionName '1.9'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
