plugins { id 'com.android.application' }

// Standard BouncyCastle X.509 certificate generation; used only when pairing.
dependencies {
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}

android {
    namespace 'lt.arturas.tvpultas'
    compileSdk 35
    defaultConfig {
        applicationId 'lt.arturas.tvpultas'
        minSdk 28
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
